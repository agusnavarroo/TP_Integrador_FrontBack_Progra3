<!DOCTYPE html>

<html lang = "es">

<head>

    <meta charset = "UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Fertin - Bienvenida</title>
    <link rel = "icon" href = "./img/fertin-favicon.png">
    <link rel = "stylesheet" href = "https://unpkg.com/@picocss/pico@latest/css/pico.classless.min.css" type = "text/css">
    <link rel = "stylesheet" href = "./css/styles.css">

</head>

<body>

    <header>

        <section id = "logo">

            <div class = "logo-container">
                
                <img src = "./img/fertin-logo.png" class = "logo" alt = "Ferretería Fertin">
            
            </div>

            <h2 class = "logo-titulo">Ferretería Fertin</h2>

        </section>

        <nav>

            <ul class = "lista-nav">

                <li><a href = "./index.html">Inicio</a></li>
                <li><a href = "http://localhost:3000/login">Admin</a></li>
                <li><button id = "btn-tema" class = "btn-tema">Modo oscuro</button></li>
            
            </ul>
        </nav>

    </header>

    <main>

        <section class = "bienvenida-container">

            <h1>Bienvenido a Ferretería Fertin</h1>

            <p>Ingresá tu nombre para empezar a comprar</p>

            <form id = "bienvenidaForm">

                <label for = "nombreCliente">Nombre</label>
                <input type = "text" name = "nombre" id = "nombreCliente" placeholder = "Tu nombre" required>
                <input type = "submit" value = "Continuar">

            </form>

            <p id = "mensaje-bienvenida"></p>

        </section>

    </main>

    <script src = "./js/bienvenida.js"></script>
    <script src = "./js/tema.js"></script>

    <footer>Fernando Cantero - Agustin Ariel Navarro</footer>

</body>
</html>
